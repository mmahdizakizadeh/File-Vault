<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10172a">

  <title>ورود استاد | FileVault</title>

  <meta
    name="description"
    content="ورود امن استاد به سامانه مدیریت تمرین‌ها و ارسال‌های دانشجویان FileVault"
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="css/login.css">
</head>

<body class="login-body">

  <main class="login-shell">

    <a class="brand login-brand" href="login.html" aria-label="FileVault">
      <span class="brand-mark">F</span>

      <span>
        <strong>FileVault</strong>
        <small>مدیریت هوشمند فایل‌ها</small>
      </span>
    </a>

    <section class="login-card" aria-labelledby="login-title">

      <div class="login-icon" aria-hidden="true">↗</div>

      <p class="eyebrow">TEACHER WORKSPACE</p>

      <h1 id="login-title">ورود به پنل استاد</h1>

      <p class="muted login-intro">
        برای مدیریت سری تمرین‌ها و بررسی ارسال دانشجویان وارد حساب کاربری خود شوید.
      </p>

      <form id="login-form" novalidate>

        <label for="email">نام کاربری</label>

        <input
          id="email"
          name="username"
          type="text"
          autocomplete="username"
          placeholder="نام کاربری خود را وارد کنید"
          required
          maxlength="150"
          aria-describedby="login-error"
        >

        <label for="password">رمز عبور</label>

        <div class="password-wrap">

          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            placeholder="رمز عبور خود را وارد کنید"
            required
            aria-describedby="login-error"
          >

          <button
            type="button"
            class="password-toggle"
            id="toggle-password"
            aria-label="نمایش رمز عبور"
            aria-pressed="false"
          >
            نمایش
          </button>

        </div>

        <p
          class="form-error"
          id="login-error"
          role="alert"
          aria-live="polite"
        ></p>

        <button
          class="btn btn-primary btn-full"
          type="submit"
          id="login-submit"
        >
          <span class="submit-label">ورود به پنل</span>
          <span aria-hidden="true">←</span>
        </button>

      </form>

      <a class="back-link" href="../index.html">
        بازگشت به پنل دانشجو
      </a>

    </section>

    <p class="footer-note">
      FileVault · Teacher Workspace
    </p>

  </main>

  <script src="js/login.js" defer></script>

</body>
</html>
